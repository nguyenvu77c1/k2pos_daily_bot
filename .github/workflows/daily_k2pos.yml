name: K2POS Daily Telegram Bot

on:
  schedule:
    # 02:00 UTC = 09:00 AM VN | 09:00 UTC = 16:00 PM VN
    - cron: '0 2,9 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run K2POS Daily Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python k2pos_daily_bot.py
